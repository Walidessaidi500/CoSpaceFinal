<div class="flex h-screen bg-gray-50 dark:bg-[#0b1120] overflow-hidden">
  <!-- Sidebar -->
  <app-sidebar-admin></app-sidebar-admin>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <main class="flex-1 overflow-y-auto p-8 relative">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-8">{{ 'ADMIN.SPACES.EDIT_TITLE' | translate
      }}</h1>

      <!-- Loading API -->
      @if (isLoading) {
        <div class="flex flex-col items-center justify-center py-12">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
          <p class="text-gray-500 dark:text-gray-400">{{ loadingText }}</p>
        </div>
      }

      <!-- Error -->
      @if (errorMessage && !isLoading) {
        <div
          class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-4 rounded-lg mb-6">
          {{ errorMessage }}
          <button (click)="loadEspacioData()" class="underline ml-2">Reintentar</button>
        </div>
      }

      <!-- Form -->
      <div [class.hidden]="isLoading || errorMessage">
        <app-formulario-espacio [isEditMode]="true"></app-formulario-espacio>

        <!-- Footer Actions -->
        <div
          class="mt-8 flex justify-between items-center pb-8 border-t border-gray-200 dark:border-gray-800 pt-6">
          <button (click)="openDeleteModal()"
            class="px-6 py-2.5 text-red-600 bg-red-50 border border-transparent rounded-lg shadow-sm hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all font-medium dark:bg-red-900/20 dark:text-red-400 dark:hover:bg-red-900/30">
            {{ 'ADMIN.SPACES.TOOLTIPS.DELETE' | translate }}
          </button>

          <div class="flex gap-3">
            <button (click)="onCancelar()"
              class="px-6 py-2.5 text-gray-700 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-all dark:bg-gray-800 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-700">
              {{ 'ADMIN.SPACES.BTN_CANCEL' | translate }}
            </button>
            <button (click)="onGuardar()"
              class="px-6 py-2.5 text-white bg-blue-600 rounded-lg shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all font-medium">
              {{ 'ADMIN.SPACES.BTN_SAVE' | translate }}
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Confirm Modal -->
  <app-confirm-modal [isOpen]="showDeleteModal" [title]="'ADMIN.SPACES.MODAL_DELETE_TITLE' | translate"
    [message]="'ADMIN.SPACES.MODAL_DELETE_MESSAGE' | translate" [isLoading]="deletingId !== null"
    (confirm)="confirmDelete()" (cancel)="closeDeleteModal()">
  </app-confirm-modal>
</div>
