<div
  class="min-h-screen bg-[#f4f4f6] dark:bg-primary-blue flex justify-center items-center py-12 px-4 transition-colors duration-300">
  <div
    class="bg-white dark:bg-[#1a2736] p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md border border-transparent dark:border-gray-700 transition-colors duration-300">
    <h2 class="text-3xl font-bold text-center text-slate-900 dark:text-white mb-2">Verificación en 2 pasos</h2>
    <p class="text-gray-500 dark:text-gray-400 text-center mb-8">
      Introduce el código de 6 dígitos que enviamos a <strong>{{ email }}</strong>
    </p>

    @if (errorMessage) {
      <div
        class="mb-4 p-4 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-xl text-center">
        {{ errorMessage }}
      </div>
    }

    <div class="space-y-6">
      <div>
        <label class="block text-sm font-bold text-slate-700 dark:text-gray-300 mb-2">Código de
        Seguridad</label>
        <input type="text" [(ngModel)]="code" placeholder="123456" maxlength="6"
          class="w-full bg-gray-100 dark:bg-gray-700/50 border border-transparent dark:border-gray-600 rounded-lg px-4 py-3 text-center text-2xl tracking-widest text-gray-700 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:bg-white dark:focus:bg-gray-700 focus:border-orange-500 dark:focus:border-orange-500 transition">
        </div>

        <button (click)="verify()" [disabled]="isLoading || code.length < 6"
          class="w-full bg-orange-500 hover:bg-orange-600 disabled:bg-orange-300 dark:disabled:bg-orange-500/50 text-white font-bold py-4 rounded-full transition duration-300 shadow-lg transform active:scale-[0.99]">
          {{ isLoading ? 'Verificando...' : 'Verificar' }}
        </button>

        <div class="text-center mt-4">
          <a routerLink="/iniciar-sesion"
            class="text-sm text-gray-500 dark:text-gray-400 hover:text-orange-500 dark:hover:text-orange-400 transition-colors">
          Volver al inicio de sesión
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Loading Overlay -->
@if (isLoading) {
  <div
    class="fixed inset-0 bg-white/80 dark:bg-primary-blue/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-all">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 dark:border-gray-700 border-t-orange-500">
    </div>
    <p class="mt-4 text-gray-600 dark:text-gray-300 font-medium">Verificando...</p>
  </div>
}
