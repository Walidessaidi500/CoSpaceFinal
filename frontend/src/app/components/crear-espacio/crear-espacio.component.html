<div class="flex min-h-screen bg-neutral-bg dark:bg-primary-blue transition-colors duration-300">
  <app-sidebar-anfitrion></app-sidebar-anfitrion>

  <div class="flex-grow relative flex flex-col">

    <!-- Loading Screen -->
    @if (isLoading) {
      <div
        class="fixed top-0 bottom-0 right-0 left-0 md:left-64 bg-white/95 dark:bg-primary-blue/95 z-[50] flex flex-col items-center justify-center transition-colors duration-300">
        <div class="relative w-20 h-20 mb-4">
          <div class="absolute inset-0 border-4 border-neutral-200 dark:border-gray-700 rounded-full"></div>
          <div class="absolute inset-0 border-4 border-primary-orange rounded-full border-t-transparent animate-spin">
          </div>
        </div>
        <h3 class="text-xl font-semibold text-primary-blue dark:text-white animate-pulse">{{ loadingText }}</h3>
        <p class="text-neutral-text dark:text-gray-400 text-sm mt-2">Por favor espera un momento</p>
      </div>
    }

    <!-- Toast Notification -->
    @if (showToast) {
      <div class="fixed top-24 right-8 z-[100] transition-all transform duration-300 ease-in-out"
        [ngClass]="{'translate-y-0 opacity-100': showToast, '-translate-y-4 opacity-0': !showToast}">
        <div class="flex items-center gap-3 px-6 py-4 rounded-xl shadow-lg border-l-4 bg-white"
          [ngClass]="{'border-green-500': toastType === 'success', 'border-red-500': toastType === 'error'}">
          <!-- Icon -->
          <div class="flex-shrink-0">
            @if (toastType === 'success') {
              <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            }
            @if (toastType === 'error') {
              <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            }
          </div>
          <!-- Content -->
          <div>
            <h4 class="font-bold text-sm"
              [ngClass]="{'text-green-800': toastType === 'success', 'text-red-800': toastType === 'error'}">
              {{ toastType === 'success' ? '¡Éxito!' : 'Error' }}
            </h4>
            <p class="text-sm text-neutral-600">{{ toastMessage }}</p>
          </div>
          <!-- Close Button -->
          <button (click)="showToast = false" class="ml-4 text-neutral-400 hover:text-neutral-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
    }

    <main class="flex-grow p-8">
      <app-formulario-espacio [isEditMode]="isEditMode"></app-formulario-espacio>
    </main>

    <div class="sticky bottom-0 z-40">
      <app-footer-acciones [isEditMode]="isEditMode" (guardar)="onGuardar()" (cancelar)="onCancelar()">
      </app-footer-acciones>
    </div>
  </div>
</div>
