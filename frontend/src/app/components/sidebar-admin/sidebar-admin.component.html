<aside

    <nav class="grow space-y-2">
        <p class="text-[11px] font-medium text-white/40 px-3 uppercase tracking-wider mb-4">{{ 'SIDEBAR_ADMIN.TITLE' |
            translate }}</p>

        <a routerLink="/admin/panel"
            routerLinkActive="bg-[#1a2942] border-r-4 border-primary-orange text-white font-bold"
            [routerLinkActiveOptions]="{exact: true}"
            class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/5 rounded-xl transition-all group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">

            </svg>
            <span class="text-sm font-medium group-hover:text-white">{{ 'SIDEBAR_ADMIN.DASHBOARD' | translate }}</span>
        </a>

        <a routerLink="/admin/usuarios"
            routerLinkActive="bg-[#1a2942] border-r-4 border-primary-orange text-white font-bold"

            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">

            </svg>
            <span class="text-sm font-medium group-hover:text-white">{{ 'SIDEBAR_ADMIN.USERS' | translate }}</span>
        </a>

        <a routerLink="/admin/espacios"
            routerLinkActive="bg-[#1a2942] border-r-4 border-primary-orange text-white font-bold"
            class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/5 rounded-xl transition-all group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            </svg>
            <span class="text-sm font-medium group-hover:text-white">{{ 'SIDEBAR_ADMIN.SPACES' | translate }}</span>
        </a>

        <a routerLink="/admin/reservas"
            routerLinkActive="bg-[#1a2942] border-r-4 border-primary-orange text-white font-bold"
            class="flex items-center gap-3 px-4 py-3 text-white/70 hover:bg-white/5 rounded-xl transition-all group">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span class="text-sm font-medium group-hover:text-white">{{ 'SIDEBAR_ADMIN.REPORTS' | translate }}</span>
        </a>

</aside>
